name: Publish npm packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable published release with its original attested assets
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.repository == 'romanilyin/canonicalpath' && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'release' && github.event.release.prerelease == false)) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      attestations: read
    outputs:
      kind: ${{ steps.release.outputs.kind }}
      version: ${{ steps.release.outputs.version }}
      manifest_sha256: ${{ steps.release.outputs.manifest_sha256 }}
      release_manifest_sha256: ${{ steps.release.outputs.release_manifest_sha256 }}
      source_commit: ${{ steps.release.outputs.source_commit }}
      release_id: ${{ steps.release.outputs.release_id }}
      artifact_id: ${{ steps.artifacts.outputs.artifact-id }}
    steps:
      # Only verifier code from the executing workflow commit is loaded. No
      # release-selected script, source checkout, dependency install or rebuild.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Verify immutable original release and producer provenance
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          RELEASE_EVENT_ID: ${{ github.event_name == 'release' && github.event.release.id || '' }}
          RELEASE_EVENT_SHA: ${{ github.event_name == 'release' && github.sha || '' }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
        run: node scripts/verify-npm-release.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # immutable verified data transfer
        id: artifacts
        with:
          name: npm-packages
          archive: true
          path: |
            ${{ runner.temp }}/npm-packages/*.tgz
            ${{ runner.temp }}/npm-packages/manifest.tsv
            ${{ runner.temp }}/npm-packages/release-manifest.json
          if-no-files-found: error
          retention-days: 7

  # Fresh runner: no repository checkout, dependency installation, build code,
  # package lifecycle execution, or persisted executable state from the build.
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    environment: npm-immutable
    permissions:
      contents: read
      id-token: write
    env:
      NODE_VERSION: 24.18.0
      NPM_VERSION: 11.16.0
      RELEASE_KIND: ${{ needs.verify.outputs.kind }}
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
      MANIFEST_SHA256: ${{ needs.verify.outputs.manifest_sha256 }}
      RELEASE_MANIFEST_SHA256: ${{ needs.verify.outputs.release_manifest_sha256 }}
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # same-run immutable artifacts
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/npm-packages
          digest-mismatch: error

      - name: Verify artifact manifest and tarball digests
        run: |
          umask 077
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npm-publisher.npmrc"
          export NPM_CONFIG_GLOBALCONFIG="$RUNNER_TEMP/npm-publisher-global.npmrc"
          printf 'NPM_CONFIG_USERCONFIG=%s\nNPM_CONFIG_GLOBALCONFIG=%s\n' "$NPM_CONFIG_USERCONFIG" "$NPM_CONFIG_GLOBALCONFIG" >> "$GITHUB_ENV"
          : > "$NPM_CONFIG_USERCONFIG"
          : > "$NPM_CONFIG_GLOBALCONFIG"
          test "$(node --version)" = "v$NODE_VERSION"
          test "$(npm --version)" = "$NPM_VERSION"
          cd "$RUNNER_TEMP/npm-packages"
          printf '%s  release-manifest.json\n' "$RELEASE_MANIFEST_SHA256" | sha256sum --check --strict
          printf '%s  manifest.tsv\n' "$MANIFEST_SHA256" | sha256sum --check --strict
          node --input-type=module <<'JS'
          import { readFileSync, lstatSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const expected = new Set(process.env.RELEASE_KIND === 'full'
            ? ['@romanilyin/canonicalpath', '@romanilyin/canonicalpath-standalone', 'com.romanilyin.canonicalpath']
            : ['com.romanilyin.canonicalpath']);
          const rows = readFileSync('manifest.tsv', 'utf8').trimEnd().split('\n');
          if (rows.length !== expected.size) throw new Error('Wrong artifact count');
          for (const row of rows) {
            const [name, version, integrity, filename, extra] = row.split('\t');
            if (!expected.delete(name) || version !== process.env.RELEASE_VERSION || extra !== undefined
              || !/^[A-Za-z0-9_.-]+\.tgz$/.test(filename) || !/^sha512-[A-Za-z0-9+/]+={0,2}$/.test(integrity)) throw new Error('Invalid artifact manifest');
            if (!lstatSync(filename).isFile() || lstatSync(filename).size < 1 || lstatSync(filename).size > 64 * 1024 * 1024) throw new Error('Artifact size or type is invalid');
            const actual = 'sha512-' + createHash('sha512').update(readFileSync(filename)).digest('base64');
            if (actual !== integrity) throw new Error('Artifact integrity mismatch');
            // Read metadata only, with no OIDC variables in the tar subprocess.
            const metadata = JSON.parse(execFileSync('tar', ['--extract', '--to-stdout', '--gzip', '--file', filename, '--', 'package/package.json'], {
              encoding: 'utf8', maxBuffer: 64 * 1024, timeout: 10000,
              env: { PATH: process.env.PATH, LANG: 'C' },
            }));
            if (metadata.name !== name || metadata.version !== version || metadata.private === true) throw new Error('Artifact package identity is invalid');
            const config = metadata.publishConfig;
            if (!config || Array.isArray(config) || typeof config !== 'object'
              || Object.keys(config).some(key => !['registry', 'access'].includes(key))
              || !['https://registry.npmjs.org', 'https://registry.npmjs.org/'].includes(config.registry)
              || config.access !== 'public') throw new Error('Artifact publishConfig must select HTTPS npmjs and public access only');
          }
          JS

      - name: Preflight npm versions
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from "node:child_process";
          import { readFileSync, writeFileSync } from "node:fs";
          import path from "node:path";

          // This source is mirrored verbatim in the privileged workflow, which never
          // checks out or executes repository/asset-provided helpers. Tests enforce parity.
          function calendarVersionParts(value) {
            const match = typeof value === "string" && value.length <= 100 && /^([1-9][0-9]{3})\.([1-9]|1[0-2])\.([1-9]|[12][0-9]|3[01])-(0|[1-9][0-9]*)$/.exec(value);
            if (!match) throw new Error("Unsupported calendar version in npm registry preflight");
            const [, year, month, day, sequence] = match;
            const date = new Date(Date.UTC(Number(year), Number(month) - 1, Number(day)));
            if (date.getUTCMonth() + 1 !== Number(month) || date.getUTCDate() !== Number(day)) throw new Error("Invalid calendar date in npm registry preflight");
            return [year, month, day, sequence].map(part => BigInt(part));
          }

          function isLaterCalendarVersion(version, latest) {
            const requested = calendarVersionParts(version), current = calendarVersionParts(latest);
            for (let index = 0; index < requested.length; index++) {
              if (requested[index] !== current[index]) return requested[index] > current[index];
            }
            return false;
          }

          export function planPublication(rows, lookup) {
            const pending = [];
            const skipped = [];
            for (const row of rows) {
              const [name, version, integrity, filename, extra] = row.split("\t");
              if (!name || !version || !/^sha512-[A-Za-z0-9+/]{86}==$/.test(integrity ?? "") ||
                  !/^[A-Za-z0-9][A-Za-z0-9_.-]*\.tgz$/.test(filename ?? "") || extra !== undefined) throw new Error("Invalid verified publication row");
              calendarVersionParts(version);
              const current = lookup(name, version);
              if (!current || typeof current !== "object" || current.integrity === undefined || current.latest === undefined) throw new Error("Registry preflight must check both the target version and latest");
              if (current.integrity === null) {
                if (current.latest !== null && !isLaterCalendarVersion(version, current.latest)) throw new Error(`${name}@${version} would replace an equal or newer latest; refusing a rollback`);
                pending.push({ name, version, integrity, filename });
                continue;
              }
              if (current.integrity !== integrity) throw new Error(`${name}@${version} is already published with different contents`);
              if (current.latest !== version) throw new Error(`${name}@${version} is published, but latest points to a different version; refusing a rollback`);
              skipped.push({ name, version });
            }
            return { pending, skipped };
          }

          function view(args, missingAllowed = false, run = execFileSync) {
            let output;
            try {
              output = run("npm", ["view", ...args, "--json", "--registry=https://registry.npmjs.org/", "--strict-ssl=true"], {
                encoding: "utf8", timeout: 60000, maxBuffer: 1024 * 1024, stdio: ["ignore", "pipe", "pipe"],
              });
            } catch (error) {
              let failure;
              try { failure = JSON.parse(String(error.stdout)); } catch { /* Any non-JSON failure is fatal. */ }
              if (missingAllowed && error.status !== 0 && failure?.error?.code === "E404") return null;
              throw new Error("npm registry preflight failed; no package will be published", { cause: error });
            }
            const value = JSON.parse(output);
            if (typeof value !== "string" || !value) throw new Error("Invalid npm registry preflight response");
            return value;
          }

          export function preflightNpmPackages(directory, run = execFileSync) {
            const rows = readFileSync(path.join(directory, "manifest.tsv"), "utf8").trimEnd().split("\n");
            const result = planPublication(rows, (name, version) => {
              const integrity = view([`${name}@${version}`, "dist.integrity"], true, run);
              // A missing old version must not skip the latest check and roll back a newer release.
              const latest = view([name, "dist-tags.latest"], integrity === null, run);
              return { integrity, latest };
            });
            // All package identities have been checked before exposing any pending row.
            const pending = result.pending.map(entry => [entry.name, entry.version, entry.integrity, path.join(directory, entry.filename)].join("\t")).join("\n");
            writeFileSync(path.join(directory, "pending.tsv"), pending ? pending + "\n" : "", { mode: 0o600 });
            for (const entry of result.skipped) console.log(`${entry.name}@${entry.version} already has the original integrity; skipping`);
          }
          preflightNpmPackages(process.env.RUNNER_TEMP + '/npm-packages');
          JS

      - name: Verify npm trusted publishing access
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const requestUrl = process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
          const requestToken = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
          if (!requestUrl || !requestToken) throw new Error('GitHub OIDC permission is unavailable');
          const url = new URL(requestUrl);
          url.searchParams.set('audience', 'npm:registry.npmjs.org');
          const identityResponse = await fetch(url, {
            headers: { Authorization: `Bearer ${requestToken}` }, redirect: 'error',
          });
          if (!identityResponse.ok) throw new Error(`GitHub OIDC request failed (HTTP ${identityResponse.status})`);
          const { value: identityToken } = await identityResponse.json();
          if (typeof identityToken !== 'string' || !identityToken) throw new Error('GitHub OIDC response has no identity token');
          const pending = readFileSync(`${process.env.RUNNER_TEMP}/npm-packages/pending.tsv`, 'utf8').trim();
          for (const row of pending ? pending.split('\n') : []) {
            const [name] = row.split('\t');
            const response = await fetch(`https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${encodeURIComponent(name)}`, {
              method: 'POST', headers: { Authorization: `Bearer ${identityToken}` }, redirect: 'error',
            });
            if (!response.ok) throw new Error(`${name}: npm trusted publisher rejected OIDC (HTTP ${response.status}); check repository, workflow filename, environment and publishing permission`);
            const result = await response.json();
            if (typeof result.token !== 'string' || !result.token) throw new Error(`${name}: npm OIDC response has no publish token`);
            console.log(`${name}: npm trusted publisher accepted OIDC`);
          }
          JS

      - name: Publish to npm
        run: |
          PENDING="$RUNNER_TEMP/npm-packages/pending.tsv"

          if [[ ! -s "$PENDING" ]]; then
            echo "All release artifacts are already published"
            exit 0
          fi

          while IFS=$'\t' read -r name version _ tarball; do
            echo "Publishing $name@$version"
            npm publish "$tarball" --ignore-scripts=true --access public --tag latest --registry=https://registry.npmjs.org/ --strict-ssl=true
          done < "$PENDING"
