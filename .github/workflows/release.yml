name: release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-readiness:
    name: manual release readiness check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.9"
          cache-dependency-path: packages/go/go.mod
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:changelog
      - run: pnpm verify
      - run: pnpm go:race
      - run: pnpm ts:pack:dry-run
      - run: pnpm js:standalone:pack:dry-run
