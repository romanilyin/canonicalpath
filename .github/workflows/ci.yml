name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-readiness:
    name: local release readiness gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.9"
          cache-dependency-path: packages/go/go.mod
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm go:race
      - name: Prepare release artifact transfer fixture
        run: |
          mkdir -p "$RUNNER_TEMP/release-artifact-transfer/upload"
          cd "$RUNNER_TEMP/release-artifact-transfer/upload"
          for package in ts standalone unity; do
            printf '{"name":"transport-fixture-%s"}\n' "$package" > package.json
            tar -czf "$package.tgz" package.json
          done
          sha256sum -- *.tgz > manifest.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifact-transfer
          archive: true
          path: |
            ${{ runner.temp }}/release-artifact-transfer/upload/*.tgz
            ${{ runner.temp }}/release-artifact-transfer/upload/manifest.sha256
          if-no-files-found: error
          retention-days: 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifact-transfer
          path: ${{ runner.temp }}/release-artifact-transfer/download
          digest-mismatch: error
      - name: Verify release artifact transfer
        run: |
          cd "$RUNNER_TEMP/release-artifact-transfer/download"
          cmp manifest.sha256 "$RUNNER_TEMP/release-artifact-transfer/upload/manifest.sha256"
          sha256sum --check --strict manifest.sha256

  windows-powershell:
    name: Windows PowerShell module smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.9"
          cache-dependency-path: packages/go/go.mod
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm ps:test -- --all-available
      - run: pnpm cmd:smoke
      - run: pnpm security:regressions
      - run: go test ./packages/go/canonicalfs ./packages/go/canonicalfsrpc ./packages/go/cmd/canonicalfs-daemon
      - run: pnpm ps:alloc -- --all-available
      - run: pnpm ps:transport:alloc -- --all-available
