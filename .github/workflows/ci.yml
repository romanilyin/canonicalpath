name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-readiness:
    name: local release readiness gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.10"
          cache-dependency-path: packages/go/go.mod
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm go:race
      - name: Prepare release artifact transfer fixture
        run: |
          mkdir -p "$RUNNER_TEMP/release-artifact-transfer/upload"
          cd "$RUNNER_TEMP/release-artifact-transfer/upload"
          for package in ts standalone unity; do
            printf '{"name":"transport-fixture-%s"}\n' "$package" > package.json
            tar -czf "$package.tgz" package.json
          done
          sha256sum -- *.tgz > manifest.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifact-transfer
          archive: true
          path: |
            ${{ runner.temp }}/release-artifact-transfer/upload/*.tgz
            ${{ runner.temp }}/release-artifact-transfer/upload/manifest.sha256
          if-no-files-found: error
          retention-days: 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifact-transfer
          path: ${{ runner.temp }}/release-artifact-transfer/download
          digest-mismatch: error
      - name: Verify release artifact transfer
        run: |
          cd "$RUNNER_TEMP/release-artifact-transfer/download"
          cmp manifest.sha256 "$RUNNER_TEMP/release-artifact-transfer/upload/manifest.sha256"
          sha256sum --check --strict manifest.sha256

  windows-powershell:
    name: Windows PowerShell module smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.10"
          cache-dependency-path: packages/go/go.mod
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm ps:test -- --shell pwsh --shell powershell.exe --allow-windows-powershell
      - run: pnpm cmd:smoke
      - run: pnpm security:regressions
      - run: go test ./packages/go/canonicalfs ./packages/go/canonicalfsrpc ./packages/go/cmd/canonicalfs-daemon
      - name: Windows bootstrap private-DACL tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SystemDrive -notmatch '^[A-Za-z]:$') { throw 'Expected a local system drive' }
          $testRoot = Join-Path ($env:SystemDrive + '\') ('canonicalfs-bootstrap-ci-' + [guid]::NewGuid().ToString('N'))
          if (Test-Path -LiteralPath $testRoot) { throw 'Private test path already exists' }
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          try { $userSid = $identity.User.Value } finally { $identity.Dispose() }
          $security = [Security.AccessControl.DirectorySecurity]::new()
          $security.SetSecurityDescriptorSddlForm("O:${userSid}D:P(A;OICI;FA;;;${userSid})(A;OICI;FA;;;SY)(A;OICI;FA;;;BA)")
          $previousTemp = $env:TEMP
          $previousTmp = $env:TMP
          $ownsTestRoot = $false
          $testExitCode = 1
          try {
            $directory = [IO.DirectoryInfo]::new($testRoot)
            [IO.FileSystemAclExtensions]::Create($directory, $security)
            $directory.Refresh()
            $actualSecurity = [IO.FileSystemAclExtensions]::GetAccessControl($directory)
            if (($directory.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
                -not $actualSecurity.AreAccessRulesProtected -or
                $actualSecurity.GetOwner([Security.Principal.SecurityIdentifier]).Value -ne $userSid) {
              throw 'New test root must be owned by the current user with a protected DACL and no reparse point'
            }
            $ownsTestRoot = $true
            $env:TEMP = $testRoot
            $env:TMP = $testRoot
            go test -count=1 ./packages/go/cmd/canonicalfs-bootstrap
            $testExitCode = $LASTEXITCODE
          } finally {
            $env:TEMP = $previousTemp
            $env:TMP = $previousTmp
            if ($ownsTestRoot) { Remove-Item -LiteralPath $testRoot -Recurse -Force }
          }
          exit $testExitCode
      - run: pnpm ps:alloc -- --shell pwsh --shell powershell.exe --allow-windows-powershell
      - run: pnpm ps:transport:alloc -- --shell pwsh --shell powershell.exe --allow-windows-powershell
